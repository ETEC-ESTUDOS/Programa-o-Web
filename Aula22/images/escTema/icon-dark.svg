<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonGlow" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C9C4F5"/>
      <stop offset="100%" stop-color="#6C63B5"/>
    </radialGradient>
  </defs>

  <!-- halo suave -->
  <circle cx="32" cy="32" r="26" fill="#6C63B5" opacity="0.12"/>

  <!-- estrelinhas -->
  <g fill="#B8B2E8">
    <circle cx="12" cy="16" r="1.6"/>
    <circle cx="50" cy="14" r="1.2"/>
    <circle cx="53" cy="46" r="1.6"/>
  </g>

  <!-- lua crescente (círculo cheio menos um círculo deslocado) -->
  <mask id="crescentMask">
    <rect x="0" y="0" width="64" height="64" fill="white"/>
    <circle cx="26" cy="26" r="15" fill="black"/>
  </mask>
  <circle cx="34" cy="32" r="16" fill="url(#moonGlow)" stroke="#5A52A0" stroke-width="1.5" mask="url(#crescentMask)"/>

  <!-- crateras sutis -->
  <g fill="#5A52A0" opacity="0.5">
    <circle cx="41" cy="24" r="1.8"/>
    <circle cx="44" cy="33" r="1.2"/>
    <circle cx="38" cy="39" r="1.4"/>
  </g>
</svg>
