<head>
    <meta charset="UTF-8">
    <title>Tags: p e br</title>
    <style>
        img{
            height: 400px;
        }
    </style>
</head>
<body>
    <p>Os passaros voam de acordo com sua <br> vontade</p>
    <p>As andorinhas voam <p> longe </p>

     <!-- <p> = paragrafo -->
    <!-- <br> = brake row-->
</body>
