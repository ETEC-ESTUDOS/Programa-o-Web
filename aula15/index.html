<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gustavo Baraldi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Os amigos verdadeiros:</h1>
        <div class="bloco-type1">
            <h2>Estão ao nosso lado nos momentos difíceis.</h2>
        </div>
        <h1>Tambem:</h1>
        <div class="bloco-type1">
            <h2>Compartilham alegria e boas lembranças.</h2>
        </div>
        <h1>E:</h1>
        <div class="bloco-type2">
            <h2>Sabem ouvir com carinho e atenção.</h2>
        </div>
        <h1>E ainda:</h1>
        <div class="bloco-type2">
            <h2>Incentivam uns aos outros a nunca desistir.</h2>
        </div>
        <p id="final">A amizade torna a vida mais especial!</p>
    </div>
    </body>
    </html>
